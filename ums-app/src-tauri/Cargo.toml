# Path: ums-app/src-tauri/Cargo.toml

[package]
name = "ums-app"
version = "0.1.3"
description = "Ubuveil Management System"
authors = ["Petro Malamule"]
edition = "2021"

[lib]
name = "ums_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tokio = { version = "1.0", features = ["full"] }
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.156.0", features = ["behavior-version-latest"] }
chrono = "0.4"
notify = "6.1"
walkdir = "2.5"
keyring = { version = "3", features = ["windows-native"] }
