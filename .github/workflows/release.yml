# Path: .github/workflows/release.yml
# Purpose: Build signed NSIS installer, publish to Releases, and push latest.json to updates branch.

name: Release

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and release Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "ums-app/package-lock.json"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "ums-app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: ums-app
        run: npm ci

      - name: TypeScript check
        working-directory: ums-app
        run: npx tsc --noEmit

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ums-app
          tagName: ${{ github.ref_name }}
          releaseName: "UMS ${{ github.ref_name }}"
          releaseBody: "Automated release. See commits since previous tag for full changes."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target x86_64-pc-windows-msvc

      - name: Commit latest.json to updates branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Find the generated latest.json in the build output
          $latestJson = Get-ChildItem -Path "ums-app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/latest.json"
          
          # Create or switch to the updates branch
          git fetch origin updates
          git checkout updates || git checkout -b updates
          
          # Copy the new file to the root of the repository
          Copy-Item $latestJson.FullName -Destination "latest.json" -Force
          
          # Commit and push the updated manifest
          git add latest.json
          git commit -m "chore: update manifest for ${{ github.ref_name }}" || exit 0
          git push origin updates
        shell: pwsh